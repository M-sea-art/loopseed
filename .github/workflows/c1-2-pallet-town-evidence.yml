name: C1.2 Pallet Town evidence

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/c1-2-pallet-town-evidence.yml
      - experiments/c1.2-pallet-town/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c1-2-pallet-town-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Frozen external case
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout LOOPSEED experiment
        uses: actions/checkout@v4

      - name: Checkout frozen Pallet Town subject
        uses: actions/checkout@v4
        with:
          repository: PauliusOS/pallet-town-3d
          ref: d49e0c0de836892133b3b21f50c9d29749879db5
          path: subject
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: subject/package-lock.json

      - name: Execute bounded repair verification
        run: |
          bash experiments/c1.2-pallet-town/run-round2.sh \
            "$GITHUB_WORKSPACE/subject" \
            "$GITHUB_WORKSPACE/evidence"

      - name: Publish run summary
        if: always()
        run: |
          if [[ -f evidence/summary.md ]]; then
            cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# LOOPSEED C1.2" >> "$GITHUB_STEP_SUMMARY"
            echo "The runner ended before producing summary.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-2-pallet-town-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
