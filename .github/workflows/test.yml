name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate JSON
        run: |
          python -m json.tool .codex-plugin/plugin.json > /dev/null
          python -m json.tool hooks/hooks.json > /dev/null
          find skills/loopseed/schemas skills/loopseed/templates -name '*.json' -print0 \
            | xargs -0 -n1 python -m json.tool > /dev/null
      - name: Validate production usage guide version
        run: python tools/verify_usage_guide_version.py
      - name: Compile Python
        run: python -m compileall -q hooks skills/loopseed/scripts tests tools
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke general One-Shotted CLI
        run: |
          root="$(mktemp -d)"
          git -C "$root" init -q
          git -C "$root" config user.email "ci@example.invalid"
          git -C "$root" config user.name "LoopSeed CI"
          printf 'frozen candidate\n' > "$root/artifact.txt"
          printf 'print("verified")\n' > "$root/verify.py"
          git -C "$root" add artifact.txt verify.py
          git -C "$root" commit -qm "candidate"
          head="$(git -C "$root" rev-parse HEAD)"
          python skills/loopseed/scripts/one_shotted.py init --root "$root" --goal "Ship a verified migration report"
          python skills/loopseed/scripts/one_shotted.py add-gate --root "$root" --id SMOKE --title Smoke --criterion "CLI completes" --owner lead --verifier verifier --machine
          python skills/loopseed/scripts/one_shotted.py add-gate --root "$root" --id BAR --title "Quality bar" --criterion "The candidate meets the declared smoke-quality reference" --owner lead --verifier fresh-critic --bar --machine
          python skills/loopseed/scripts/one_shotted.py transition --root "$root" --phase PLAN --next "Declare work"
          python skills/loopseed/scripts/one_shotted.py add-task --root "$root" --id BUILD --purpose "Build frozen candidate" --owner lead --write-scope artifact.txt
          python skills/loopseed/scripts/one_shotted.py task-status --root "$root" --task BUILD --status RUNNING --actor lead --summary "Build started"
          python skills/loopseed/scripts/one_shotted.py task-status --root "$root" --task BUILD --status SUCCEEDED --actor lead --summary "Build completed"
          python skills/loopseed/scripts/one_shotted.py transition --root "$root" --phase IMPLEMENT --next "Build candidate"
          python skills/loopseed/scripts/one_shotted.py transition --root "$root" --phase VERIFY --next "Freeze candidate"
          python skills/loopseed/scripts/one_shotted.py bind --root "$root" --project general-smoke --candidate "$head" --artifact artifact.txt
          python skills/loopseed/scripts/one_shotted.py run-evidence --root "$root" --gate SMOKE --actor verifier --command "python verify.py" --project general-smoke --candidate "$head" --artifact artifact.txt
          python skills/loopseed/scripts/one_shotted.py run-evidence --root "$root" --gate BAR --actor fresh-critic --command "python verify.py" --project general-smoke --candidate "$head" --artifact artifact.txt
          python skills/loopseed/scripts/one_shotted.py finalize --root "$root"
          python skills/loopseed/scripts/one_shotted.py validate --root "$root" --require-final
      - name: Smoke game dialogue and creative lock
        run: |
          root="$(mktemp -d)"
          git -C "$root" init -q
          git -C "$root" config user.email "ci@example.invalid"
          git -C "$root" config user.name "LoopSeed CI"
          printf 'frozen game candidate\n' > "$root/artifact.txt"
          printf 'print("game verified")\n' > "$root/verify.py"
          git -C "$root" add artifact.txt verify.py
          git -C "$root" commit -qm "game candidate"
          head="$(git -C "$root" rev-parse HEAD)"
          python skills/loopseed/scripts/one_shotted.py init \
            --root "$root" \
            --goal "Build a browser game where autonomous characters drive events"

          model_json="$(python skills/loopseed/scripts/one_shotted.py dialogue-turn \
            --root "$root" \
            --actor model \
            --kind question \
            --summary "Choose how the first slice proves that the world is alive" \
            --effect preserve \
            --effect amplify \
            --advance core_loop \
            --advance hero_moment \
            --option "A|Studio crisis|A complete bounded playable loop" \
            --option "B|Cinematic scene|More spectacle but weaker gameplay proof" \
            --recommended A)"
          model_id="$(printf '%s' "$model_json" | python -c 'import json,sys; print(json.load(sys.stdin)["event_id"])')"

          user_json="$(python skills/loopseed/scripts/one_shotted.py dialogue-turn \
            --root "$root" \
            --actor user \
            --kind decision \
            --summary "Choose A and preserve indirect control")"
          user_id="$(printf '%s' "$user_json" | python -c 'import json,sys; print(json.load(sys.stdin)["event_id"])')"

          cat > "$root/.loopseed/brief.json" <<JSON
          {
            "project_domain": "game",
            "production_mode": "studio",
            "seed_intent": "Build a browser game where autonomous characters drive events.",
            "product_outcome": "A presentation-ready playable vertical slice.",
            "north_star": "The world feels alive because characters act from their own motives.",
            "original_user_ideas": ["autonomous characters"],
            "preserved_ideas": ["indirect control"],
            "revisions": [],
            "amplifications": ["One crisis creates visible systemic consequences."],
            "decisions": ["Studio mode", "bounded crisis"],
            "bounded_scope": ["one level", "one complete loop"],
            "non_goals": ["open world"],
            "must_not_lose": ["autonomous behavior", "playable loop"],
            "reference_roles": ["No external project defines identity"],
            "required_evidence": ["complete playthrough", "fixed screenshot", "performance report"],
            "game": {
              "player_promise": "Influence a living world without puppeteering every character.",
              "player_role": "Indirect director.",
              "core_loop": "Observe, allocate, decide, witness consequences, restart.",
              "world_response": "Characters act according to motives and relationships.",
              "unique_hook": "Autonomous motives drive events.",
              "art_direction": "Coherent stylized game world.",
              "game_feel": "Immediate readable feedback.",
              "hero_moment": "The whole level visibly reacts to one crisis.",
              "vertical_slice": "One complete crisis loop.",
              "asset_strategy": "Replace all visible placeholders before visual PASS.",
              "performance_budget": {"fps": 60, "triangles": 2200000}
            },
            "general": {
              "user_job": "",
              "primary_flow": "",
              "artifact_type": "",
              "target_stage": "",
              "success_metrics": ""
            },
            "moonshot": {
              "ambition_expansion": "",
              "scope_guard": ""
            },
            "authorization": {"user_event_id": "$user_id"},
            "dialogue_event_ids": ["$model_id", "$user_id"]
          }
          JSON

          python skills/loopseed/scripts/one_shotted.py lock-brief --root "$root" --file "$root/.loopseed/brief.json"
          python skills/loopseed/scripts/one_shotted.py add-gate --root "$root" --id FLOW --title Flow --criterion "The slice completes" --owner lead --verifier verifier --machine
          python skills/loopseed/scripts/one_shotted.py add-gate --root "$root" --id BAR --title "Quality bar" --criterion "The real slice meets the declared game-quality comparison" --owner lead --verifier fresh-critic --bar --machine
          python skills/loopseed/scripts/one_shotted.py transition --root "$root" --phase PLAN --next "Plan the slice"
          python skills/loopseed/scripts/one_shotted.py transition --root "$root" --phase IMPLEMENT --next "Build the slice"
          python skills/loopseed/scripts/one_shotted.py transition --root "$root" --phase VERIFY --next "Freeze the slice"
          python skills/loopseed/scripts/one_shotted.py bind --root "$root" --project game-smoke --candidate "$head" --artifact artifact.txt
          python skills/loopseed/scripts/one_shotted.py run-evidence --root "$root" --gate FLOW --actor verifier --command "python verify.py" --project game-smoke --candidate "$head" --artifact artifact.txt
          python skills/loopseed/scripts/one_shotted.py run-evidence --root "$root" --gate BAR --actor fresh-critic --command "python verify.py" --project game-smoke --candidate "$head" --artifact artifact.txt
          python skills/loopseed/scripts/one_shotted.py finalize --root "$root"
          python skills/loopseed/scripts/one_shotted.py validate --root "$root" --require-final

  windows-integrity-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Windows runtime paths
        run: python -m compileall -q hooks skills/loopseed/scripts tools
      - name: Exercise concurrent verifier locking on Windows
        run: python -m unittest tests.test_integrity_adversarial.IntegrityBridgeAdversarialTests.test_parallel_gate_receipts_merge_without_lost_updates -v
      - name: Smoke Windows bind, evidence, and finalize
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("loopseed-win-" + [guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $root | Out-Null
          git -C $root init -q
          git -C $root config user.email "ci@example.invalid"
          git -C $root config user.name "LoopSeed CI"
          Set-Content -Path (Join-Path $root "artifact.txt") -Value "frozen windows candidate"
          Set-Content -Path (Join-Path $root "verify.py") -Value 'print("windows verified")'
          git -C $root add artifact.txt verify.py
          git -C $root commit -qm "candidate"
          $head = (git -C $root rev-parse HEAD).Trim()

          python skills/loopseed/scripts/one_shotted.py init --root $root --goal "Ship a Windows-verified migration report"
          python skills/loopseed/scripts/one_shotted.py add-gate --root $root --id WIN --title "Windows smoke" --criterion "Windows CLI completes" --owner lead --verifier verifier --machine
          python skills/loopseed/scripts/one_shotted.py add-gate --root $root --id BAR --title "Quality bar" --criterion "The Windows candidate meets the declared quality bar" --owner lead --verifier fresh-critic --bar --machine
          python skills/loopseed/scripts/one_shotted.py transition --root $root --phase PLAN --next "Declare work"
          python skills/loopseed/scripts/one_shotted.py add-task --root $root --id BUILD --purpose "Build frozen candidate" --owner lead --write-scope artifact.txt
          python skills/loopseed/scripts/one_shotted.py task-status --root $root --task BUILD --status RUNNING --actor lead --summary "Build started"
          python skills/loopseed/scripts/one_shotted.py task-status --root $root --task BUILD --status SUCCEEDED --actor lead --summary "Build completed"
          python skills/loopseed/scripts/one_shotted.py transition --root $root --phase IMPLEMENT --next "Build candidate"
          python skills/loopseed/scripts/one_shotted.py transition --root $root --phase VERIFY --next "Freeze candidate"
          python skills/loopseed/scripts/one_shotted.py bind --root $root --project windows-smoke --candidate $head --artifact artifact.txt
          python skills/loopseed/scripts/one_shotted.py run-evidence --root $root --gate WIN --actor verifier --command "python verify.py" --project windows-smoke --candidate $head --artifact artifact.txt
          python skills/loopseed/scripts/one_shotted.py run-evidence --root $root --gate BAR --actor fresh-critic --command "python verify.py" --project windows-smoke --candidate $head --artifact artifact.txt
          python skills/loopseed/scripts/one_shotted.py finalize --root $root
          python skills/loopseed/scripts/one_shotted.py validate --root $root --require-final
