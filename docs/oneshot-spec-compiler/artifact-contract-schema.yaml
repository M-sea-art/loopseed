# LOOPSEED One-Shot Calibration Upgrade v0.4.0

version: "0.4.0"

artifact_contract:
  purpose: prevent_unrequested_artifact_substitution_and_bind_strategy_to_real_delivery

  required:
    - contract_id
    - project_binding_id
    - seed_intent
    - artifact_type
    - deliverables
    - acceptance
    - forbidden_substitutions
    - required_evidence
    - implementation_strategy

  seed_intent:
    role: semantic_anchor_from_user_seed_and_calibration_answer
    rule: may_be_clarified_but_not_replaced_or_weakened_without_user_authority

  deliverables:
    rule: every_deliverable_has_acceptance_and_evidence

  implementation_strategy:
    role: selected_delivery_route_not_a_fourth_integrity_lock
    fields:
      - recommended_stack
      - repository_fit
      - artifact_fit
      - stage_fit
      - strategic_tradeoffs
      - rejected_alternatives
    rules:
      - infer_and_recommend_before_asking
      - prefer_project_native_stack_when_sufficient
      - user_decides_only_material_product_tradeoffs
      - reversible_low_level_choices_remain_executor_owned
      - strategy_must_serve_seed_intent_artifact_and_stage
      - strategy_must_not_downgrade_product_form_or_quality_target
    freeze_when:
      - stack_choice_changes_product_form
      - stack_choice_changes_delivery_target
      - stack_choice_changes_required_evidence
      - strategy_is_required_for_task_graph_consistency

  non_degradable:
    description: qualities_that_must_survive_implementation_choices
    default:
      - seed_intent
      - project_identity
      - requested_artifact_type
      - target_stage
      - explicit_user_constraints

  substitution:
    default: forbidden
    allowed_only_when:
      - user_explicitly_accepts_substitute
      - substitute_preserves_non_degradable_requirements
      - stage_target_remains_satisfied

  evidence:
    rules:
      - runnable_evidence_proves_function_only
      - visual_completion_requires_visual_evidence
      - source_presence_does_not_prove_deliverable_quality
      - every_acceptance_item_must_be_observed
      - implementation_strategy_claims_require_build_or_runtime_evidence

  immutable_after_lock:
    - contract_id
    - project_binding_id
    - seed_intent
    - artifact_type
    - non_degradable
    - forbidden_substitutions
    - material_implementation_strategy

failure_codes:
  missing_contract: BLOCK_ARTIFACT_CONTRACT_MISSING
  seed_intent_drift: BLOCK_SEED_INTENT_DRIFT
  wrong_artifact_type: BLOCK_WRONG_ARTIFACT
  forbidden_substitution: BLOCK_FORBIDDEN_SUBSTITUTION
  strategy_mismatch: BLOCK_IMPLEMENTATION_STRATEGY
  insufficient_evidence: BLOCK_ARTIFACT_EVIDENCE
