# LOOPSEED One-Shot Production Integrity Patch v0.3.1

version: "0.3.1"

brands:
  call_of_duty:
    invokes:
      - cinematic_action
      - mission_structure
      - strong_feedback
      - aaa_presentation

  rimworld:
    invokes:
      - emergent_storytelling
      - simulation_depth
      - colony_management

  cultist_simulator:
    invokes:
      - card_driven_systems
      - hidden_combinations
      - narrative_emergence

trigger_gate:
  source_must_be:
    - current_explicit_user_goal
    - bound_project_authoritative_source
  output_scope: transferable_design_principles_only
  may_not_set:
    - project_binding
    - artifact_contract
    - stage_target
  may_not_import:
    - another_project_prompt
    - another_project_visual_contract
    - another_project_acceptance_contract
    - another_project_benchmark_result

rule:
  brand_reference_is_not_copy: true
  extract_design_principles_only: true
  preserve_integrity_lock: true
  cross_project_inheritance_default: reject
