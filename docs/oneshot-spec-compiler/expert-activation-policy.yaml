# LOOPSEED Game-First Expert Activation Policy v0.5.0

version: "0.5.0"

policy:
  order:
    - creative_dialogue_or_direct_contract
    - creative_brief_lock_when_enabled
    - project_binding
    - artifact_contract
    - stage_target
    - production_mode
    - expert_activation

  principle:
    - "Creative dialogue selects the shot; experts execute the locked shot."
    - "Compiler should select experts, not replace execution agents."
    - "Knowledge injection and parallel execution are separate layers."
    - "Experts may improve execution but may not rewrite locked production intent."
    - "Game projects receive game-production expertise before generic software convenience."
    - "Do not trade delivery speed for unnecessary governance."

preproduction_role:
  creative_director:
    active_when: calibration_enabled
    responsibilities:
      - preserve_user_seed
      - expose_contradictions
      - amplify_strongest_experience
      - complete_missing_game_logic
      - continue_accepted_ideas
      - present_2_to_4_options_with_recommendation
      - compile_user_authorized_creative_brief
    may_not:
      - authorize_for_user
      - write_production_artifacts_before_lock
      - lower_ambition_for_implementation_convenience
      - approve_final_quality

production_modes:
  focused:
    description: "Smallest complete route for clear and bounded work."
    behavior:
      - validate_integrity_lock
      - activate_minimum_experts
      - prefer_single_lead
      - add_verifier_at_real_gates
      - execute_parallel_only_for_proven_independent_gaps
      - alignment_review

  studio:
    description: "Default game-production route for a coherent presentation-ready vertical slice."
    behavior:
      - validate_integrity_lock
      - activate_game_director
      - activate_visual_or_ui_or_audio_or_technical_roles_only_when_the_slice_requires_them
      - bounded_multi_agent_execution
      - whole_game_merge
      - playtest_and_visual_critic
      - performance_verification

  moonshot:
    description: "Aggressive but bounded production around one or a few hero experiences."
    behavior:
      - validate_ambition_expansion_and_scope_guard
      - validate_integrity_lock
      - activate_full_required_game_studio
      - fan_out_independent_quality_surfaces
      - allow_contract_identical_candidates
      - one_final_integration_owner
      - harsh_whole_product_critic
      - extended_verification
      - no_evidence_relaxation

expert_roles:
  game_director:
    default: reviewer
    promote_to_executor_when:
      - new_core_loop_required
      - player_promise_or_world_response_requires_implementation
      - gameplay_system_changes
      - complete_vertical_slice_composition
    owns_when_promoted:
      - core_game_experience
      - game_identity_consistency

  visual_director:
    default: reviewer
    promote_to_executor_when:
      - visual_rework
      - environment_art
      - character_art
      - style_consistency
      - art_bible_required
      - hero_shot_required
    may_not_own:
      - final_gate_for_own_visual_work

  game_feel_specialist:
    default: reviewer
    promote_to_executor_when:
      - input_response_is_material
      - camera_or_movement_requires_tuning
      - combat_or_state_feedback_is_core
      - first_minute_experience_is_weak

  asset_pipeline_specialist:
    default: reviewer
    promote_to_executor_when:
      - multiple_asset_families_required
      - generated_or_external_assets_require_normalization
      - placeholder_replacement_is_material
      - provenance_or_license_risk_exists

  ui_designer:
    default: reviewer
    promote_to_executor_when:
      - interface_design
      - interaction_readability
      - game_ui_must_integrate_with_world_identity

  audio_designer:
    default: reviewer
    promote_to_executor_when:
      - sound_is_required_for_game_feel
      - procedural_or_generated_audio_pipeline_required
      - feedback_or_ambience_is_a_quality_gate

  technical_architect:
    default: reviewer
    promote_to_executor_when:
      - architecture_risk_detected
      - performance_regression_detected
      - platform_or_packaging_constraint_is_material
      - shared_runtime_state_needs_single_ownership

  performance_specialist:
    default: verifier_or_read_only_advisor
    promote_to_executor_when:
      - required_budget_failed
      - profiling_identifies_isolated_optimization_units
    may_not:
      - approve_own_performance_gate
      - remove_core_experience_to_pass_without_contract_authority

  playtest_verifier:
    default: verifier
    responsibilities:
      - run_complete_primary_flow
      - check_success_failure_and_restart
      - inspect_first_minute_comprehension
      - record_runtime_and_console_evidence
    may_not:
      - implement_the_flow_being_approved

scope_guard:
  rules:
    - "Only activate experts relevant to the locked goal scope."
    - "Every expert inherits the same creative brief and integrity references."
    - "Use project-local evidence before transferable reference principles."
    - "Do not convert every benchmark into a full product rewrite."
    - "Do not replace parallel execution with sequential analysis by default."
    - "Verification depth must match task risk and selected production mode."
    - "No expert may change creative_brief_id, project_binding_id, artifact_contract_id, or stage_target_id."
    - "No expert may expand Moonshot beyond its scope guard."
    - "No expert may approve its own quality gate."

repair_budget:
  max_major_cycles: 3
  priorities:
    - integrity_blocker
    - goal_or_core_loop_blocker
    - user_visible_regression
    - critical_runtime_failure
    - required_performance_gate
  defer:
    - unrelated_tooling_improvement
    - speculative_optimization
    - pre_existing_non_blocking_issue
    - feature_expansion_outside_locked_slice
