implemented_runtime_contract:
  explicit_binding:
    command: bind
    fields:
      - project_id
      - candidate_commit
      - artifact_path
      - artifact_sha256
    rules:
      - actual Git HEAD is checked when Git is available
      - identical binding is idempotent
      - a different subject requires a fresh run
  machine_evidence:
    required_subject_fields:
      - expected_artifact
      - artifact_before
      - artifact_after
      - bound_candidate_commit
      - actual_candidate_commit
    pass_rule: >-
      exit_code == 0 and actual Git HEAD matches when available and
      expected artifact == artifact before == artifact after.
    mutation_result: ARTIFACT_MUTATED_DURING_VERIFICATION
    deletion_result: ARTIFACT_MISSING_AFTER_VERIFICATION
  recovery:
    transition: BLOCKED -> ACTIVE/VERIFY
    requires:
      - active blocker ID
      - evidence newer than blocked_at
      - machine producer
      - matching project, candidate and artifact
      - exit code 0
      - integrity_stable true
  independent_audit:
    checks:
      - runner result matches exit code and integrity outcome
      - machine PASS preserves one bound artifact
      - current artifact still matches evidence
      - actual Git HEAD still matches the binding
      - gate evidence is newer than the latest resume
  finalization:
    requires:
      - all required gates PASS
      - machine gates have integrity-stable evidence
      - no open P0/P1 defect
      - current binding remains valid

implemented_tests:
  - explicit_binding_allows_machine_gate_without_blocker
  - identical_binding_is_idempotent
  - silent_rebinding_is_rejected
  - verifier_mutates_artifact_and_exits_zero_is_rejected
  - unblock_command_mutates_artifact_is_not_resumable
  - forged_pass_with_mismatched_hashes_is_rejected
  - actual_git_head_mismatch_is_rejected
  - existing_blocked_resume_verify_finalize_flow_still_passes
  - original_one_shotted_tests_still_pass
  - lifecycle_hook_tests_still_pass
  - c1_cli_dispatch_is_protected

