interface:
  display_name: "LoopSeed"
  short_description: "Aim game ideas, then launch autonomous verified One-Shot production"
  default_prompt: "$loopseed one-shotted Co-direct this game idea until the product, scope, North Star and evidence contract are precise, then lock the shot and continue autonomously without routine human checkpoints. Build, play, look, critique, repair and reverify until independently verified or truly externally blocked."
policy:
  allow_implicit_invocation: false
